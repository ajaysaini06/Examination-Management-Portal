{% extends "base.html" %}
{% block title %}{{ 'Edit' if editing else 'Add' }}Criterion{% endblock %}
{% block content %}
<div class="card auth-card"><div class="card-body p-4">
    <h4 class="card-title">{{ 'Edit' if editing else 'Add' }} Criterion</h4>
    <p class="text-muted small">{{ exam.exam_name }} ({{ exam.course_code }}), maximum {{ exam.max_marks }} marks</p>
    <form method="post">
        <div class="mb-3"><label class="form-label" for="criterion_name">Criterion Name</label>
            <input class="form-control" id="criterion_name" name="criterion_name" value="{{ form.get('criterion_name', '') }}" required></div>
        <div class="row">
            <div class="col-md-6 mb-3"><label class="form-label" for="max_marks">Maximum marks</label>
                <input type="number" step="0.5" min="0.5" class="form-control" id="max_marks" name="max_marks" value="{{ form.get('max_marks', '') }}" required></div>
            <div class="col-md-6 mb-3"><label class="form-label" for="weightage">Weightage % (Optional)</label>
                <input type="number" step="0.1" min="0" max="100" class="form-control" id="weightage" name="weightage" value="{{ form.get('weightage', '') if form.get('weightage') is not none else '' }}"></div>
        </div>
        <div class="mb-3"><label class="form-label" for="description">Description</label>
            <textarea class="form-control" id="description" name="description" rows="2">{{ form.get('description', '') or '' }}</textarea></div>>
        <button class="btn btn-primary">Save</button>
        <a href="{{ url_for('admin.rubrics', exam_id=exam.id) }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div></div>
{% endblock %}
