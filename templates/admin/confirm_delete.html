{% extends "base.html" %}
{% block tittle %}Confirm delete{% endblock %}
{% block content %}
<div class="card auth-card">
    <div class="card-body p-4">
        <h4 class="card-title text-danger"> Confirm Deletion</h4>
        <p>Are you sure want to delete <strong>{{ what }}</strong>? This cannot be undone.</p>
        <form method="post" class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
