{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="card auth-card">
  <div class="card-body p-4">
    <h4 class="card-title mb-3">Student Registration</h4>
    <form method="post">
      <div class="mb-3">
        <label class="form-label" for="name">Full name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ form.get('name', '') }}" required>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" name="email" value="{{ form.get('email', '') }}" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="phone">Phone</label>
          <input type="tel" class="form-control" id="phone" name="phone" value="{{ form.get('phone', '') }}">
        </div>
      </div>
      <div class="row">
        <div class="col-md-5 mb-3">
          <label class="form-label" for="roll_no">Roll number</label>
          <input type="text" class="form-control" id="roll_no" name="roll_no" value="{{ form.get('roll_no', '') }}" required>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label" for="program">Program</label>
          <input type="text" class="form-control" id="program" name="program" value="{{ form.get('program', '') }}" required>
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label" for="year">Year</label>
          <input type="number" class="form-control" id="year" name="year" min="1" max="6" value="{{ form.get('year', '') }}" required>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" name="password" minlength="6" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="confirm_password">Confirm password</label>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>
    <p class="mt-3 mb-0 small">Already registered? <a href="{{ url_for('auth.login') }}">Login</a></p>
  </div>
</div>
{% endblock %}
