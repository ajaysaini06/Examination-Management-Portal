{% extends "base.html" %}
{% block title %}{{title}}{% endblock %}
{% block content %}
    <div class="card auth-card"><div class="card-body p-4">
        <h4 class="card-title text-danger">{{ title }}</h4>
        <p>{{ message }}</p>
        <form method="POST" class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">{{ button }}</button>
            <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Go Back</a>
        </form>
    </div><div>
{% endblock %}
